<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#11151b" />
  <meta name="description" content="USA Cop Watch — a public directory of police officers who have separated from their departments, organized by state and county." />
  <title>USA Cop Watch</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjI4IiBmaWxsPSIjMmI0ZDhmIi8+PHRleHQgeD0iOTYiIHk9IjEyMiIgZm9udC1mYW1pbHk9InN5c3RlbS11aSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjYwIiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5VU0E8L3RleHQ+PC9zdmc+" />
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxOTIgMTkyIj48cmVjdCB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgcng9IjI4IiBmaWxsPSIjMmI0ZDhmIi8+PHRleHQgeD0iOTYiIHk9IjEyMiIgZm9udC1mYW1pbHk9InN5c3RlbS11aSxzYW5zLXNlcmlmIiBmb250LXNpemU9IjYwIiBmb250LXdlaWdodD0iNzAwIiBmaWxsPSIjZmZmIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIj5VU0E8L3RleHQ+PC9zdmc+" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand" id="brand-home" role="button" tabindex="0">
      <span class="brand-mark">USA</span>
      <span class="brand-name">USA Cop Watch</span>
    </div>

    <div class="searchbar">
      <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search-input" type="text"
             placeholder="Search name, department, county, state…"
             autocomplete="off" spellcheck="false" />
      <button id="search-clear" class="search-clear" hidden aria-label="Clear">×</button>
    </div>

    <nav class="topnav">
      <button id="back-btn" class="back-btn" hidden>← United States</button>
      <a href="about.html" class="nav-link-desktop">About</a>
      <a href="mailto:USACopWatch@proton.me" class="nav-link-desktop">Right of reply</a>

      <button id="menu-btn" class="menu-btn" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
    </nav>

    <div id="mobile-menu" class="mobile-menu" hidden>
      <a href="about.html" data-menu-close>About</a>
      <a href="mailto:USACopWatch@proton.me" data-menu-close>Right of reply</a>
    </div>
  </header>

  <div class="stage">
    <div id="map"></div>

    <div class="legend">
      <div class="legend-title">Entries per state</div>
      <div class="legend-row"><span class="swatch s0"></span>0</div>
      <div class="legend-row"><span class="swatch s1"></span>1–4</div>
      <div class="legend-row"><span class="swatch s2"></span>5–19</div>
      <div class="legend-row"><span class="swatch s3"></span>20+</div>
    </div>

    <div class="statcard">
      <div class="stat-label">Total documented</div>
      <div class="stat-value" id="total-count">0</div>
      <div class="stat-sub">officers across <span id="state-count">0</span> states</div>
    </div>

    <button id="drawer-close" class="drawer-close" aria-label="Close">×</button>

    <aside id="drawer" class="drawer">
      <div id="breadcrumb">United States</div>
      <div id="results">
        <p class="hint">Click a state to view entries.</p>
      </div>
    </aside>
  </div>

  <footer class="pagefooter">
    <span>Every entry links to a primary source. Labels: confirmed / reported / disputed.</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
