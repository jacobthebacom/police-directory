<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Officer Separation Directory</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">OSD</span>
      <span class="brand-name">Officer Separation Directory</span>
    </div>
    <nav class="topnav">
      <button id="back-btn" class="back-btn" hidden>← United States</button>
      <a href="#policy">Policy</a>
      <a href="mailto:you@example.com">Right of reply</a>
    </nav>
  </header>

  <div class="stage">
    <div id="map"></div>

    <div class="legend">
      <div class="legend-title">Entries per state</div>
      <div class="legend-row"><span class="swatch s0"></span>0</div>
      <div class="legend-row"><span class="swatch s1"></span>1–4</div>
      <div class="legend-row"><span class="swatch s2"></span>5–19</div>
      <div class="legend-row"><span class="swatch s3"></span>20+</div>
    </div>

    <div class="statcard">
      <div class="stat-label">Total documented</div>
      <div class="stat-value" id="total-count">0</div>
      <div class="stat-sub">officers across <span id="state-count">0</span> states</div>
    </div>

    <button id="drawer-close" class="drawer-close" aria-label="Close">×</button>

    <aside id="drawer" class="drawer">
      <div id="breadcrumb">United States</div>
      <div id="results">
        <p class="hint">Click a state to view entries.</p>
      </div>
    </aside>
  </div>

  <footer id="policy" class="pagefooter">
    <span>Every entry links to a primary source. Labels: confirmed / reported / disputed.</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
